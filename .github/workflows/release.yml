name: Release (Android + Web)

on:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.x'
  JAVA_VERSION: '17'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print versions
        run: |
          flutter --version
          java -version

      - name: Get package dependencies
        run: flutter pub get

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      # -Pdisable-abi-filtering=true 让 app/build.gradle.kts 里的
      # abiFilters("arm64-v8a") 生效，只打 64 位包（Flutter 3.44+ 必需）。
      # --obfuscate + --split-debug-info 把 Dart 符号从 libapp.so 里剥离出来，
      # 符号文件单独作为 artifact 保留，用于事后还原混淆后的堆栈。
      - name: Build release APK
        working-directory: example
        run: |
          flutter build apk --release -Pdisable-abi-filtering=true \
            --obfuscate --split-debug-info=build/app/symbols

      - name: Upload Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: app-release-symbols
          path: example/build/app/symbols
          if-no-files-found: warn
          retention-days: 30

      - name: Rename APK
        id: rename-apk
        working-directory: example
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find build/app/outputs/flutter-apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No APK produced by flutter build apk" >&2
            exit 1
          fi
          asset="dist/card_fan_spread_example-${TAG}.apk"
          cp "$apk" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          ls -lh "$asset"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: example/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" example/dist/*.apk --repo "$GH_REPO" --clobber

  build-web:
    name: Build Web bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print versions
        run: flutter --version

      - name: Get package dependencies
        run: flutter pub get

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      # 这里打的是可直接下载部署的包（默认 base href "/"，需放在站点根目录下）；
      # GitHub Pages 那份带 "/card-fan-spread-widget/" 前缀的构建仍由 deploy_web.yml 负责。
      - name: Build release web
        working-directory: example
        run: flutter build web --release

      - name: Zip web bundle
        working-directory: example
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/web && zip -r -q "../../dist/card_fan_spread_example_web-${TAG}.zip" .)
          ls -lh dist/*.zip

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-web
          path: example/dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach web bundle to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" example/dist/*.zip --repo "$GH_REPO" --clobber
